<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郊遊意願調查</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f5f5f7; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { text-align: center; color: #333; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

<div class="card">
  <h2>🚌 郊遊意願調查表</h2>
  <form id="surveyForm">
    <div class="form-group">
      <label for="name">姓名</label>
      <input type="text" id="name" required placeholder="請輸入姓名">
    </div>
    
    <div class="form-group">
      <label for="attend">是否參加</label>
      <select id="attend" onchange="toggleCountRequired()">
        <option value="是">是，我要參加</option>
        <option value="否">否，不參加</option>
      </select>
    </div>

    <div class="form-group" id="countGroup">
      <label for="count">參加人數 (含本人)</label>
      <input type="number" id="count" value="1" min="1">
    </div>

    <button type="submit" id="submitBtn">提交調查</button>
  </form>
</div>

<script>
  // 填寫 Web App URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbywrcfAvONm5lenStXkAxxWnVcgX8oy9xveTqcSP-E/dev";

  function toggleCountRequired() {
    const attend = document.getElementById('attend').value;
    const countGroup = document.getElementById('countGroup');
    if (attend === '否') {
      countGroup.style.display = 'none';
      document.getElementById('count').value = 0;
    } else {
      countGroup.style.display = 'block';
      document.getElementById('count').value = 1;
    }
  }

  document.getElementById('surveyForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "傳送中...";

    const payload = {
      name: document.getElementById('name').value,
      attend: document.getElementById('attend').value,
      count: parseInt(document.getElementById('count').value)
    };

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert('提交成功！謝謝你的回覆。');
      document.getElementById('surveyForm').reset();
      toggleCountRequired();
    })
    .catch(err => {
      alert('提交失敗，請稍後再試。');
      console.error(err);
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "提交調查";
    });
  });
</script>

</body>
</html>
